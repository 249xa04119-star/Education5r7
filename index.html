<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EduNova AI - Frontend Version</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0f2027;
  color:white;
}
.container{
  padding:20px;
}
.card{
  background:#1f1f1f;
  padding:15px;
  margin:10px 0;
  border-radius:8px;
}
button{
  padding:8px 12px;
  margin:5px 0;
  background:#00ffff;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
input{
  padding:6px;
  margin:5px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>EduNova AI</h1>

<h2>Enter Student Scores</h2>

<div class="card">
Math: <input type="number" id="mathInput"><br>
Science: <input type="number" id="scienceInput"><br>
English: <input type="number" id="englishInput"><br>
<button onclick="calculate()">Generate Report</button>
</div>

<h2>Student Dashboard</h2>

<div class="card">Math Score: <span id="mathAvg">0</span></div>
<div class="card">Science Score: <span id="scienceAvg">0</span></div>
<div class="card">English Score: <span id="englishAvg">0</span></div>
<div class="card">Overall: <span id="overallAvg">0</span></div>
<div class="card">Risk Level: <span id="riskLevel">-</span></div>

<canvas id="chart"></canvas>

<h2>AI Tutor</h2>
<input id="botInput" placeholder="Ask about math/science/english">
<button onclick="askBot()">Ask</button>
<p id="botReply"></p>

<button onclick="generatePDF()">Download Report PDF</button>

</div>

<script>

let chartInstance;

/* ===== CALCULATE ===== */
function calculate(){
  let m = parseFloat(document.getElementById("mathInput").value) || 0;
  let s = parseFloat(document.getElementById("scienceInput").value) || 0;
  let e = parseFloat(document.getElementById("englishInput").value) || 0;

  let overall = (m + s + e) / 3;

  document.getElementById("mathAvg").innerText = m.toFixed(1);
  document.getElementById("scienceAvg").innerText = s.toFixed(1);
  document.getElementById("englishAvg").innerText = e.toFixed(1);
  document.getElementById("overallAvg").innerText = overall.toFixed(1);
  document.getElementById("riskLevel").innerText = detectRisk(overall);

  renderChart([m, s, e]);
}

/* ===== RISK DETECTION ===== */
function detectRisk(score){
  if(score < 40) return "High Risk";
  if(score < 70) return "Moderate Risk";
  return "Low Risk";
}

/* ===== CHART ===== */
function renderChart(data){
  const ctx = document.getElementById("chart").getContext("2d");

  if(chartInstance){
    chartInstance.destroy();
  }

  chartInstance = new Chart(ctx,{
    type:"bar",
    data:{
      labels:["Math","Science","English"],
      datasets:[{
        label:"Scores",
        data:data
      }]
    }
  });
}

/* ===== SIMPLE AI TUTOR ===== */
function askBot(){
  let q = document.getElementById("botInput").value.toLowerCase();
  let reply = "Ask about math, science, or english.";

  if(q.includes("math"))
    reply = "Practice algebra, formulas, and daily problem solving.";
  else if(q.includes("science"))
    reply = "Understand concepts clearly and revise diagrams.";
  else if(q.includes("english"))
    reply = "Improve vocabulary, grammar, and reading habits.";

  document.getElementById("botReply").innerText = reply;
}

/* ===== PDF ===== */
function generatePDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.text("EduNova AI Performance Report", 20, 20);
  doc.text("Math: " + document.getElementById("mathAvg").innerText, 20, 40);
  doc.text("Science: " + document.getElementById("scienceAvg").innerText, 20, 50);
  doc.text("English: " + document.getElementById("englishAvg").innerText, 20, 60);
  doc.text("Overall: " + document.getElementById("overallAvg").innerText, 20, 70);
  doc.text("Risk: " + document.getElementById("riskLevel").innerText, 20, 80);

  doc.save("EduNova_Report.pdf");
}

</script>

</body>
</html>
